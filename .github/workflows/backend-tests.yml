name: backend-tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgresql]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp_test
          POSTGRES_DB: erp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U erp" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Redis, pg_dump and the realtime service (end-to-end and restore-drill tests)
        run: |
          sudo apt-get update && sudo apt-get install -y redis-server postgresql-client
          cd ../services/realtime && npm ci && npm run build
      - run: pip install -e ".[dev,postgres]"
      - name: Run tests
        env:
          ERP_TEST_DATABASE_URL: ${{ matrix.database == 'postgresql' && 'postgresql+psycopg://erp:erp_test@localhost:5432/erp_test' || '' }}
        run: |
          if [ -z "$ERP_TEST_DATABASE_URL" ]; then unset ERP_TEST_DATABASE_URL; fi
          pytest -rs

  quality:
    # Lint (incl. security rules), dependency vulnerability audits, and a short load test
    # against a real server with integrity checks afterwards.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev,postgres]" ruff pip-audit
      - name: Lint
        run: ruff check app tests scripts alembic
      - name: Python dependency audit
        run: pip-audit --strict --progress-spinner off .
      - name: Node dependency audit
        working-directory: services/realtime
        run: npm ci && npm audit --omit=dev --audit-level=moderate
      - name: Load test (SQLite, 30 users, 30 s) + integrity checks
        run: python scripts/loadtest.py --users 30 --duration 30 --think 1 --workers 2

  realtime:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/realtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/realtime/package-lock.json
      - run: npm ci
      - run: npm test

  deploy:
    # Builds the production images and validates the Compose and Caddy configuration.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: |
          docker build -t erp-backend:ci backend
          docker build -t erp-realtime:ci services/realtime
      - name: Image smoke test (non-root, CLI, migrations on SQLite)
        run: |
          test "$(docker run --rm --entrypoint id erp-backend:ci -u)" = "10001"
          docker run --rm -e ERP_SECRET_KEY=ci-secret-key-ci-secret-key-ci-secret-key \
            -e ERP_DATABASE_URL=sqlite:////tmp/ci.db erp-backend:ci \
            sh -c "python -m app.cli migrate && python -m app.cli backup-keygen >/dev/null && chromium --version"
      - name: Validate Compose file
        working-directory: deploy
        run: cp .env.example .env && docker compose config --quiet && docker compose --profile postgres config --quiet
        env:
          POSTGRES_PASSWORD: ci
          ERP_TLS_ASK_TOKEN: ci
      - name: Validate Caddyfile
        run: |
          docker run --rm -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -e ERP_PRIMARY_HOST=erp.example.com -e ERP_ACME_EMAIL=ci@example.com -e ERP_TLS_ASK_TOKEN=x \
            caddy:2.8-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

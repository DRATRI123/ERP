name: backend-tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgresql]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp_test
          POSTGRES_DB: erp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U erp" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Redis and the realtime service (for end-to-end tests)
        run: |
          sudo apt-get update && sudo apt-get install -y redis-server
          cd ../services/realtime && npm ci && npm run build
      - run: pip install -e ".[dev,postgres]"
      - name: Run tests
        env:
          ERP_TEST_DATABASE_URL: ${{ matrix.database == 'postgresql' && 'postgresql+psycopg://erp:erp_test@localhost:5432/erp_test' || '' }}
        run: |
          if [ -z "$ERP_TEST_DATABASE_URL" ]; then unset ERP_TEST_DATABASE_URL; fi
          pytest -rs

  realtime:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/realtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/realtime/package-lock.json
      - run: npm ci
      - run: npm test

[project]
name = "erp-backend"
version = "0.1.0"
description = "Private multi-business billing, accounting, inventory & GST ERP — core Python backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "email-validator>=2.2",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14",
  "argon2-cffi>=23.1",
  "pyjwt>=2.9",
  "jinja2>=3.1",
  "segno>=1.6",
  "httpx>=0.27",
  "cryptography>=42",
  "openpyxl>=3.1",
  "defusedxml>=0.7",
  "python-multipart>=0.0.9",
  "redis>=5.0",
  "dnspython>=2.6",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
dev = ["pytest>=8", "httpx>=0.27", "websockets>=13"]

[project.scripts]
erp = "app.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "DTZ", "RUF", "BLE", "C4", "PLW", "PYI", "ISC"]
ignore = [
  "E501",          # long lines: reviewed case by case (SQL, messages)
  "S101",          # asserts: type-narrowing invariants only, reviewed in docs/security.md
  "S105", "S106",  # "hardcoded password" false positives (enum values, token_type="bearer")
  "S603", "S607",  # subprocess: argument lists, no shell, inputs from configuration (pg_dump, Chromium)
  "UP046",         # Generic[T] with pydantic models
  "RUF001", "RUF002", "RUF003",  # ₹, en dashes and × in Indian-business text are intended
  "PLW0603",       # module-level singletons (engine, test transports) are deliberate
]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]  # the package, not our alembic/ folder

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares parameters with these calls in argument defaults; that is the idiom.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Header",
                          "fastapi.File", "fastapi.Form", "fastapi.Body", "fastapi.Cookie"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "DTZ", "BLE001", "PLW1510", "RUF012", "E402"]
"scripts/**" = ["S", "DTZ", "BLE001", "E402"]
"alembic/**" = ["E", "W", "I", "UP", "RUF"]
